<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gonnie Fleet — Trip Capture</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #f59e0b; --accent2: #2563eb;
    --text: #f1f5f9; --muted: #94a3b8; --ok: #22c55e; --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .toggle {
    display: flex; background: #0b1220; border-radius: 10px; padding: 4px; margin-bottom: 16px;
  }
  .toggle button {
    flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent;
    color: var(--muted); font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  .toggle button.active { background: var(--accent); color: #1a1a1a; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
    background: #0b1220; color: var(--text); font-size: 0.95rem;
  }
  textarea { resize: vertical; min-height: 50px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .hint { font-size: 0.78rem; color: var(--accent); margin-top: 4px; min-height: 1em; }
  .photo-btn {
    display: block; width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px;
    border: 2px dashed #475569; background: #0b1220; color: var(--muted);
    text-align: center; cursor: pointer; font-size: 0.9rem;
  }
  .photo-btn.has-photo { border-color: var(--ok); color: var(--ok); }
  .preview { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
  .ocr-status { font-size: 0.8rem; color: var(--accent2); margin-top: 6px; }
  .section-title {
    font-weight: 700; margin: 0 0 8px; font-size: 0.95rem; color: var(--accent);
  }
  .submit-btn {
    width: 100%; padding: 14px; margin-top: 6px; border: none; border-radius: 10px;
    background: var(--ok); color: #06240f; font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; }
  #result { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; font-size: 0.9rem; }
  #result.ok { background: #052e16; color: var(--ok); display: block; }
  #result.err { background: #2b0a0a; color: var(--err); display: block; }
  .config-warning {
    background: #3b0d0d; color: #fca5a5; padding: 10px; border-radius: 8px;
    font-size: 0.82rem; margin-bottom: 14px; display: none;
  }
</style>
</head>
<body>

<h1>🚚 Gonnie Fleet — Trip Capture</h1>
<div class="sub">Zach's Group Logistics</div>

<div id="configWarning" class="config-warning">
  ⚠️ Set <code>API_URL</code> at the top of this file's &lt;script&gt; section to your
  Apps Script <code>/exec</code> URL before this will work.
</div>

<div class="toggle">
  <button id="btnScan" class="active" onclick="setMode('scan')">📷 Scan</button>
  <button id="btnManual" onclick="setMode('manual')">⌨️ Manual</button>
</div>

<form id="tripForm">

  <div class="card">
    <div class="section-title">Vehicle & Driver</div>
    <label>Registration</label>
    <select id="registration" required>
      <option value="">Loading vehicles…</option>
    </select>
    <div class="hint" id="vehicleHint"></div>

    <label>Driver</label>
    <select id="driver_name" required>
      <option value="">Loading drivers…</option>
    </select>

    <div class="row">
      <div>
        <label>Driver Phone</label>
        <input type="tel" id="driver_phone" placeholder="0836445128">
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="date" required>
      </div>
    </div>
  </div>

  <!-- SCAN MODE: photo capture + OCR -->
  <div class="card" id="scanCard">
    <div class="section-title">Odometer — Photo</div>
    <label class="photo-btn" id="odoPhotoBtn" for="odoPhotoInput">Tap to take a photo of the odometer</label>
    <input type="file" id="odoPhotoInput" accept="image/*" capture="environment" style="display:none">
    <img id="odoPreview" class="preview">
    <div class="ocr-status" id="odoOcrStatus"></div>

    <div class="section-title" style="margin-top:16px">Fuel Receipt / Pump — Photo</div>
    <label class="photo-btn" id="fuelPhotoBtn" for="fuelPhotoInput">Tap to take a photo of the fuel receipt</label>
    <input type="file" id="fuelPhotoInput" accept="image/*" capture="environment" style="display:none">
    <img id="fuelPreview" class="preview">
    <div class="ocr-status" id="fuelOcrStatus"></div>
  </div>

  <div class="card">
    <div class="section-title">Odometer & Fuel</div>
    <div class="row">
      <div>
        <label>Odo Start (km)</label>
        <input type="number" step="any" id="odo_start" required>
      </div>
      <div>
        <label>Odo End (km)</label>
        <input type="number" step="any" id="odo_end">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Fuel Used (L)</label>
        <input type="number" step="any" id="fuel_used_l" required>
      </div>
      <div>
        <label>Cost/Liter (R)</label>
        <input type="number" step="any" id="cost_per_liter" required>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Fill Type</label>
        <select id="fill_type">
          <option value="Metered">Metered</option>
          <option value="Full-to-Full">Full-to-Full</option>
          <option value="Manual">Manual Entry</option>
        </select>
      </div>
      <div>
        <label>Fuel Filled on Return (L)</label>
        <input type="number" step="any" id="fuel_filled_return_l">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Route & Cargo</div>
    <label>Start Destination</label>
    <input type="text" id="start_destination" placeholder="151 South Coast Road, Durban" required>
    <label>End Destination <span style="color:var(--muted)">(leave blank to use route lookup)</span></label>
    <input type="text" id="end_destination" placeholder="Optional">
    <div class="row">
      <div>
        <label>Cargo Type</label>
        <input type="text" id="cargo_type" placeholder="Break Bulk">
      </div>
      <div>
        <label>Load (kg)</label>
        <input type="number" step="any" id="load_kg">
      </div>
    </div>
    <label>Fuel Station</label>
    <input type="text" id="fuel_station" placeholder="Shiptech:Catoridge">
  </div>

  <div class="card">
    <div class="section-title">Commercial</div>
    <div class="row">
      <div>
        <label>Revenue (R)</label>
        <input type="number" step="any" id="revenue" required>
      </div>
      <div>
        <label>Customer</label>
        <input type="text" id="customer">
      </div>
    </div>
    <label>Manager</label>
    <input type="text" id="manager">
    <label>Notes</label>
    <textarea id="notes" placeholder="Anything worth flagging about this trip"></textarea>
  </div>

  <button type="submit" class="submit-btn" id="submitBtn">Log Trip</button>
  <div id="result"></div>
</form>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────
  const API_URL = "https://script.google.com/macros/s/AKfycby3oRIh2tF9M_RzGctvxNQsmdRvgwLjz8DPftcDSTfbkuu21AQYFNlapjMT5ORrb159/exec";
  // ────────────────────────────────────────────────────────────────────

  if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) {
    document.getElementById('configWarning').style.display = 'block';
  }

  document.getElementById('date').valueAsDate = new Date();

  let mode = 'scan';
  function setMode(m) {
    mode = m;
    document.getElementById('btnScan').classList.toggle('active', m === 'scan');
    document.getElementById('btnManual').classList.toggle('active', m === 'manual');
    document.getElementById('scanCard').style.display = m === 'scan' ? 'block' : 'none';
  }

  // ── Load vehicles & drivers for dropdowns ─────────────────────────
  let vehicles = [];
  fetch(API_URL + "?action=vehicles")
    .then(r => r.json())
    .then(data => {
      vehicles = data.vehicles || [];
      const sel = document.getElementById('registration');
      sel.innerHTML = '<option value="">Select vehicle…</option>' +
        vehicles.map(v => `<option value="${v.registration}">${v.registration} — ${v.make} ${v.model}</option>`).join('');
    })
    .catch(() => {
      document.getElementById('registration').innerHTML = '<option value="">Could not load — check API_URL</option>';
    });

  fetch(API_URL + "?action=drivers")
    .then(r => r.json())
    .then(data => {
      const drivers = data.drivers || [];
      const sel = document.getElementById('driver_name');
      sel.innerHTML = '<option value="">Select driver…</option>' +
        drivers.map(d => `<option value="${d.driver_name}" data-phone="${d.phone || ''}">${d.driver_name}</option>`).join('');
    })
    .catch(() => {
      document.getElementById('driver_name').innerHTML = '<option value="">Could not load — check API_URL</option>';
    });

  document.getElementById('registration').addEventListener('change', e => {
    const v = vehicles.find(v => v.registration === e.target.value);
    const hint = document.getElementById('vehicleHint');
    if (v) {
      hint.textContent = `Expected ${v.expected_kml} km/L · Last odometer ${v.current_odometer} km`;
      if (!document.getElementById('odo_start').value) {
        document.getElementById('odo_start').value = v.current_odometer;
      }
    } else {
      hint.textContent = '';
    }
  });

  document.getElementById('driver_name').addEventListener('change', e => {
    const opt = e.target.selectedOptions[0];
    const phone = opt && opt.dataset.phone;
    if (phone) document.getElementById('driver_phone').value = phone;
  });

  // ── Photo capture + OCR ────────────────────────────────────────────
  function setupPhotoOcr(inputId, btnId, previewId, statusId, targetFieldId, numericHint) {
    const input = document.getElementById(inputId);
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const preview = document.getElementById(previewId);
      preview.src = url;
      preview.style.display = 'block';
      document.getElementById(btnId).classList.add('has-photo');
      document.getElementById(btnId).textContent = '✓ Photo captured — tap to retake';

      const status = document.getElementById(statusId);
      status.textContent = 'Reading photo…';

      Tesseract.recognize(file, 'eng')
        .then(({ data: { text } }) => {
          const matches = text.match(/\d[\d,\. ]{2,}\d/g) || [];
          if (matches.length) {
            const best = matches.sort((a, b) => b.length - a.length)[0]
              .replace(/[, ]/g, '');
            status.textContent = `Detected "${best}" — check the field below before submitting`;
            const field = document.getElementById(targetFieldId);
            if (!field.value) field.value = parseFloat(best) || '';
          } else {
            status.textContent = 'Could not read a number — please enter it manually';
          }
        })
        .catch(() => {
          status.textContent = 'OCR failed — please enter the value manually';
        });
    });
  }

  setupPhotoOcr('odoPhotoInput', 'odoPhotoBtn', 'odoPreview', 'odoOcrStatus', 'odo_start');
  setupPhotoOcr('fuelPhotoInput', 'fuelPhotoBtn', 'fuelPreview', 'fuelOcrStatus', 'fuel_used_l');

  // ── Submit ──────────────────────────────────────────────────────────
  document.getElementById('tripForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    btn.disabled = true;
    btn.textContent = 'Logging…';
    result.style.display = 'none';

    const payload = {
      date: document.getElementById('date').value,
      registration: document.getElementById('registration').value,
      driver_name: document.getElementById('driver_name').value,
      driver_phone: document.getElementById('driver_phone').value,
      odo_start: document.getElementById('odo_start').value,
      odo_end: document.getElementById('odo_end').value,
      fuel_used_l: document.getElementById('fuel_used_l').value,
      cost_per_liter: document.getElementById('cost_per_liter').value,
      fill_type: document.getElementById('fill_type').value,
      fuel_filled_return_l: document.getElementById('fuel_filled_return_l').value,
      start_destination: document.getElementById('start_destination').value,
      end_destination: document.getElementById('end_destination').value,
      cargo_type: document.getElementById('cargo_type').value,
      load_kg: document.getElementById('load_kg').value,
      fuel_station: document.getElementById('fuel_station').value,
      revenue: document.getElementById('revenue').value,
      customer: document.getElementById('customer').value,
      manager: document.getElementById('manager').value,
      notes: document.getElementById('notes').value
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success') {
          result.className = 'ok';
          result.textContent = `✓ Trip #${data.trip_id} logged.`;
          document.getElementById('tripForm').reset();
          document.getElementById('date').valueAsDate = new Date();
          document.getElementById('odoPreview').style.display = 'none';
          document.getElementById('fuelPreview').style.display = 'none';
        } else {
          result.className = 'err';
          result.textContent = '✗ ' + (data.message || 'Unknown error');
        }
      })
      .catch(err => {
        result.className = 'err';
        result.textContent = '✗ Network error: ' + err.message;
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'Log Trip';
      });
  });
</script>
</body>
</html>
